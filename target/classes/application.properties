spring.application.name=deviceauth
server.port=${PORT:8080}

# Database Configuration (Falls back to embedded H2 if no external MySQL DB_URL is set)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/deviceauth_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

# Use a strong Base64-encoded secret of at least 32 bytes in an environment variable for real deployments.
deviceauth.jwt.secret=${JWT_SECRET:VGhpc0lzQURldk9ubHlTZWNyZXRLZXlGb3JEZXZpY2VBdXRoMjAyNg==}
deviceauth.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
